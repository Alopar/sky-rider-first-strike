<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="menuBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030816"/>
      <stop offset="48%" stop-color="#071229"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="43%" r="58%">
      <stop offset="0%" stop-color="#173E7E" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#0B2149" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lowerGlow" cx="50%" cy="92%" r="60%">
      <stop offset="0%" stop-color="#0D5A9A" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#071B3C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F86D9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4F86D9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4F86D9" stop-opacity="0"/>
    </linearGradient>

    <pattern id="microGrid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 H 0 V 64" fill="none" stroke="#4D77BE" stroke-opacity="0.035" stroke-width="1"/>
      <path d="M 32 0 V 64 M 0 32 H 64" fill="none" stroke="#4D77BE" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.20
        0 0 0 0 0.35
        0 0 0 0 0.70
        0 0 0 0.16 0" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="screen"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#menuBgGrad)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>
  <rect width="1920" height="1080" fill="url(#lowerGlow)"/>
  <rect width="1920" height="1080" fill="url(#microGrid)" opacity="0.58"/>

  <g opacity="0.22">
    <path d="M 180 214 H 1740" stroke="url(#scanFade)" stroke-width="1"/>
    <path d="M 240 860 H 1680" stroke="url(#scanFade)" stroke-width="1"/>
    <path d="M 430 154 H 1490" stroke="url(#scanFade)" stroke-width="1"/>
  </g>

  <g fill="none" stroke="#4B75B6" stroke-opacity="0.11" stroke-width="1">
    <path d="M 300 184 H 1620"/>
    <path d="M 300 896 H 1620"/>
    <path d="M 142 280 V 800"/>
    <path d="M 1778 280 V 800"/>
  </g>

  <rect width="1920" height="1080" fill="#01040B" opacity="0.18" filter="url(#grain)"/>
  <rect width="1920" height="1080" fill="none" stroke="#000611" stroke-width="56" stroke-opacity="0.46"/>
</svg>
